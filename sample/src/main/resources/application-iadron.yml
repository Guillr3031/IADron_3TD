# Perfil IADron: activar con --spring.profiles.active=iadron
# Sobrescribe sólo lo necesario de application.yml para la infraestructura de iadron/docker-compose.yml.
# Las variables (${...}) se leen del entorno: ver iadron/.env.example

spring:
  config:
    import: optional:file:C:/Users/BEC/IdeaProjects/IADron_3TD/iadron/.env[.properties]
  datasource:
    druid:
      url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/cloud_sample?useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${MYSQL_ROOT_PASSWORD:root}
  redis:
    host: localhost
    port: 6379

mqtt:
  BASIC:
    protocol: MQTT
    # Dirección que se entrega al Dock / Pilot 2: tiene que ser la IP del PC en la red local
    host: ${SERVER_IP:192.168.1.100}
    port: 1883
    username: JavaServer
    password: 123456
    client-id: iadron-backend
    path:
  DRC:
    protocol: WS
    host: ${SERVER_IP:192.168.1.100}
    port: 8083
    path: /mqtt
    username: JavaServer
    password: 123456

oss:
  enable: true
  provider: minio
  # El dron sube las fotos directamente aquí: tiene que ser alcanzable desde el Dock / RC
  endpoint: http://10.12.54.211:9000
  access-key: ${MINIO_APP_USER:iadron}
  secret-key: ${MINIO_APP_PASSWORD:iadron-minio-123}
  bucket: cloud-bucket
  expire: 3600
  region: us-east-1
  object-dir-prefix: iadron
  # MinIO ignora el role-arn, pero no puede quedarse el texto de ejemplo de DJI
  role-arn: arn:minio:iam:::role/iadron
  role-session-name: cloudApi

ntp:
  server:
    # En la nave puede no haber internet: usa un NTP local si lo hay
    host: ${NTP_HOST:pool.ntp.org}

cloud-api:
  app:
    id: ${DJI_APP_ID:}
    key: ${DJI_APP_KEY:}
    license: ${DJI_APP_LICENSE:}

# Vídeo en directo. El application.yml de DJI trae textos de ejemplo ("Please enter...") en campos
# numéricos y el backend no arranca. Valores neutros hasta que montemos un servidor de streaming
# (para la térmica en directo lo previsto es RTSP o WHIP).
livestream:
  url:
    agora:
      channel: iadron
      token: sin-configurar
      uid: 654321
    rtmp:
      url: rtmp://${SERVER_IP}/live/
    rtsp:
      username: iadron
      password: iadron
      port: 8554
    gb28181:
      serverIP: ${SERVER_IP:192.168.1.100}
      serverPort: 5060
      serverID: "34020000002000000001"
      agentID: "34020000001320000001"
      agentPassword: iadron
      localPort: 5061
      channel: "34020000001320000001"
    whip:
      url: http://${SERVER_IP:192.168.1.100}:1985/rtc/v1/whip/?app=live&stream=iadron

logging:
  level:
    com.dji: info
    com.dji.sample.iadron: debug

# ------------------------------------------------------------------ IADron
iadron:
  emqx:
    api-url: http://localhost:18083/api/v4
    api-user: admin
    api-password: admin123
    auto-reconnect: false
    docks: 7CTXM8S00B00YC
    drone: 1581F6Q8D247300G9889
  forward:
    central-server-url: ${IADRON_CENTRAL_URL:}
    pose-path: /api/drone/pose
    capture-path: /api/drone/capture
    pose-min-interval-ms: 100
    timeout-ms: 2000
  flight-log:
    enabled: true
    directory: logs/iadron
  gnss:
    min-satellites: 8
    guard-mode: WARN
  drc:
    stick-frequency-hz: 10
    delay-time-ms: 300
    heartbeat-period-ms: 1000
    max-command-duration-ms: 1000
    max-horizontal-speed: 1.0
    max-vertical-speed: 0.5
    max-yaw-rate: 30
    server-client-id: iadron-server
  ia:
    enabled: ${IA_ENABLED:true}
    url: ${IA_URL:http://localhost:6789/iadron/api/v1/ia/mock}   # de momento, la IA falsa
    send-mode: ${IA_SEND_MODE:BASE64}
    only-thermal: true
    payload: ${IA_PAYLOAD:THERMAL_IMAGE}     # RJPEG = enviar el fichero tal cual, como antes
    irp-path: ${IA_IRP_PATH:C:/Users/BEC/IdeaProjects/Thermal_SDK/utility/bin/windows/release_x64/dji_irp.exe}
  live:
    ffmpeg-path: C:/Users/BEC/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-9.0.2-full_build/bin/ffmpeg.exe
    rtsp-url: rtsp://localhost:8554/live/1581F6Q8D247300G9889-81-0-0
    fps: 1
    video-delay-ms: 1500
    alert-threshold-c: 60